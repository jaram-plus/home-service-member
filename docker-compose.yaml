services:
  member-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: member-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ./data:/app/data
    networks:
      - app-network
    depends_on:
      - minio

  user-frontend:
    build:
      context: ./user_frontend
      dockerfile: Dockerfile
    container_name: user-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://member-service:8000
    networks:
      - app-network
    depends_on:
      - member-service

  admin-frontend:
    build:
      context: ./admin_frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    restart: unless-stopped
    ports:
      - "8502:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://member-service:8000
    networks:
      - app-network
    depends_on:
      - member-service

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    env_file:
      - .env.docker
    networks:
      - app-network
    depends_on:
      - member-service
      - user-frontend
      - admin-frontend

networks:
  app-network:
    driver: bridge

volumes:
  minio_data: